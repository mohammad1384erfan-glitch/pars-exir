    <polygon points="35,12 59,25 59,55 35,68 11,55 11,25" fill="none" stroke="url(#crystalSheen)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
    <path d="M35 15 C35 15 49 35 49 46 C49 54 42.7 60 35 60 C27.3 60 21 54 21 46 C21 35 35 15 35 15 Z" fill="url(#amberGold)"/>
    <path d="M35 26 C35 26 43 38 43 46 C43 50.4 39.4 54 35 54 C30.6 54 27 50.4 27 46 C27 38 35 26 35 26 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="35" cy="45" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <text x="95" y="44" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="900" fill="#0B192C">پارس اکسیر</text>
  <text x="95" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#D97706">PARS EXIR</text>
