<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="petroNavy" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E3E62"/>
      <stop offset="50%" stopColor="#0B192C"/>
      <stop offset="100%" stopColor="#000000"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="20" y1="15" x2="60" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE047"/>
      <stop offset="40%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <linearGradient id="crystalSheen" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stopColor="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(10, 5)">
