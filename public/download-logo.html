<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانلود رسمی لوگوی پارس اکسیر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #0b192c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #102a43;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
    p.sub { font-size: 14px; color: #94a3b8; margin-bottom: 30px; }
    .preview-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 20px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }
    .preview-box img {
      max-width: 100%;
      height: auto;
      max-height: 110px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-svg {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
    }
    .btn-svg:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
    }
    .btn-png {
      background: #1e3e62;
      color: #fff;
      border: 1px solid #38bdf8;
    }
    .btn-png:hover {
      background: #2a527f;
      transform: translateY(-2px);
    }
    .footer-note {
      font-size: 12px;
      color: #64748b;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>لوگوی رسمی پارس اکسیر</h1>
    <p class="sub">نسخه وکتور با رزولوشن فوق‌العاده بالا برای چاپ، تابلو، فاکتور و فضای مجازی</p>

    <!-- Logo Preview -->
    <div class="preview-box">
      <img id="logoImg" src="/logo.svg" alt="لوگو پارس اکسیر">
    </div>

    <!-- Download Options -->
    <div class="btn-group">
      <!-- Direct SVG Download -->
      <a href="/logo.svg" download="pars-exir-logo.svg" class="btn btn-svg">
        📥 دانلود فایل لوگو (فرمت وکتور SVG - بدون افت کیفیت)
      </a>

      <!-- Instant PNG Converter & Download -->
      <button onclick="downloadAsPNG()" class="btn btn-png">
        🖼️ دانلود فایل عکس شفاف (فرمت PNG با کیفیت 2000px)
      </button>
    </div>

    <p class="footer-note">پارس اکسیر — PARS EXIR • کیفیت صنعتی تضمین‌شده</p>
  </div>

  <script>
    function downloadAsPNG() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = '/logo.svg';
      img.onload = function() {
        const canvas = document.createElement('canvas');
        // High resolution: 2000 x 500
        canvas.width = 2000;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const a = document.createElement('a');
        a.download = 'pars-exir-logo-hd.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
    }
  </script>
</body>
</html>
