<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#102a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3d5c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent bar -->
  <rect y="580" width="1200" height="50" fill="#27ae60" opacity="0.8"/>
  <!-- Logo area -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="rgba(255,255,255,0.1)"/>
  <text x="120" y="132" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">PE</text>
  <!-- Business name Persian -->
  <text x="80" y="260" font-family="Arial,sans-serif" font-size="64" font-weight="bold" fill="white">پارس اکسیر</text>
  <!-- Tagline -->
  <text x="80" y="330" font-family="Arial,sans-serif" font-size="32" fill="#90b4ce">فروش پارافین صنعتی در کاشان</text>
  <!-- Products line -->
  <text x="80" y="400" font-family="Arial,sans-serif" font-size="26" fill="#a8c4d9">پارافین فلش ۱۲۰ | پارافین فلش ۱۴۰</text>
  <!-- Phone -->
  <text x="80" y="460" font-family="Arial,sans-serif" font-size="24" fill="#7faacc">📞 09133628681</text>
  <!-- URL -->
  <text x="80" y="560" font-family="Arial,sans-serif" font-size="22" fill="#608aaa">pars-exir.ir</text>
</svg>
